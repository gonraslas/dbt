name: sbx_test 
version: '1.0.0'
config-version: 2

# Carpeta de modelos
model-paths: ["models"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

# Configuración de modelos
models:
  sbx_medallion:
    bronze:
      +materialized: view          
      salesforce:
        +database: PRO-BRZ  
        +schema: SALESFORCE    
        +tags: bronze     
    silver:
      +materialized: table          
      logistica:
        +database: PRO-SLV
        +schema: RELATIONAL
        +tags: silver
    gold:
      +materialized: table      
      orders_analytical:
        +database: PRO-GLD
        +schema: DIMENSIONAL   
        +tags: gold
